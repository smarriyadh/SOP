<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توثيق الإجراءات - نظام التوظيف</title>
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', 'Segoe UI', sans-serif; }
    body { background: #f5f7fb; margin: 0; padding: 24px 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: white; border-radius: 28px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
    h1 { color: #1e2a3a; margin-bottom: 8px; }
    .subhead { color: #4a627a; border-right: 4px solid #2c7da0; padding-right: 16px; margin-bottom: 28px; }
    label { display: block; font-weight: 600; margin-top: 20px; margin-bottom: 6px; color: #0f2b3d; }
    input, textarea, select { width: 100%; padding: 12px 14px; border: 1px solid #cfdfed; border-radius: 16px; font-size: 0.95rem; }
    textarea { min-height: 90px; resize: vertical; }
    .row-2col { display: flex; gap: 20px; flex-wrap: wrap; }
    .row-2col > div { flex: 1; }
    button { background: #1e6f5c; color: white; border: none; padding: 14px 28px; border-radius: 40px; font-weight: bold; width: 100%; margin-top: 32px; cursor: pointer; }
    .file-zone { border: 2px dashed #bfd7e6; border-radius: 20px; padding: 16px; text-align: center; cursor: pointer; background: #fafdff; }
    .toast { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e2a3a; color: white; padding: 12px; border-radius: 60px; text-align: center; display: none; z-index: 1000; }
    @media (max-width: 640px) { .card { padding: 18px; } }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>📋 توثيق الإجراء اليدوي الحالي</h1>
    <div class="subhead">يرجى وصف خطوة واحدة من إجراءاتك اليومية. سيتم مراجعة جميع الإدخالات قبل توحيد الإجراء النهائي.</div>
    
    <form id="sopForm">
      <label>🏷️ اسم الإجراء العام (نص حر)</label>
      <input type="text" id="workflow_name" placeholder="مثال: إصدار تأشيرة عامل" required>
      
      <div class="row-2col">
        <div><label>🔢 رقم الخطوة</label><input type="number" id="step_number" required></div>
        <div><label>🧑‍💼 المسمى الوظيفي</label><input type="text" id="responsible_role"></div>
      </div>
      
      <label>📝 وصف الخطوة بالتفصيل</label>
      <textarea id="step_description" placeholder="ماذا تفعل بالضبط؟ انقر على أي زر؟ أرفق أي ملف إذا لزم الأمر" required></textarea>
      
      <label>📥 البيانات المدخلة (نص حر)</label>
      <textarea id="input_data" placeholder="مثال: رقم العميل، صورة الجواز"></textarea>
      
      <label>📤 المخرجات / النتيجة</label>
      <textarea id="output_data" placeholder="مثال: رقم طلب التأشيرة"></textarea>
      
      <label>🏛️ المنصة الحكومية</label>
      <input type="text" id="gov_platform" placeholder="قوى / مدد / مقيم">
      
      <label>⚖️ ملاحظات الامتثال</label>
      <textarea id="compliance_notes" placeholder="مثال: يجب التحقق من نسبة السعودة"></textarea>
      
      <label>📎 مرفق (اختياري) – صورة أو مستند</label>
      <div class="file-zone" onclick="document.getElementById('fileInput').click()">
        📂 اضغط لاختيار ملف
        <input type="file" id="fileInput" style="display:none" accept="image/*,application/pdf">
        <div id="fileNameDisplay" style="margin-top: 8px; font-size:0.8rem;"></div>
      </div>
      
      <label>💬 ملاحظات إضافية</label>
      <textarea id="notes"></textarea>
      
      <label>📧 بريدك الإلكتروني (للتواصل)</label>
      <input type="email" id="employeeEmail" placeholder="yourname@company.com" required>
      
      <button type="submit">✅ إرسال للمراجعة</button>
    </form>
  </div>
</div>
<div id="toastMsg" class="toast"></div>

<script>
  let selectedFile = null;
  const fileInput = document.getElementById('fileInput');
  const fileNameDisplay = document.getElementById('fileNameDisplay');
  
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) {
      selectedFile = e.target.files[0];
      fileNameDisplay.innerText = `📎 ${selectedFile.name}`;
    } else {
      selectedFile = null;
      fileNameDisplay.innerText = '';
    }
  });
  
  document.getElementById('sopForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.querySelector('button');
    btn.disabled = true;
    btn.innerText = 'جاري الإرسال...';
    
    // Prepare base64 if file exists
    let fileBase64 = '';
    let fileName = '';
    if (selectedFile) {
      const reader = new FileReader();
      const filePromise = new Promise((resolve) => {
        reader.onload = () => {
          fileBase64 = reader.result;
          fileName = selectedFile.name;
          resolve();
        };
        reader.readAsDataURL(selectedFile);
      });
      await filePromise;
    }
    
    const payload = {
      workflow_name: document.getElementById('workflow_name').value,
      step_number: document.getElementById('step_number').value,
      step_description: document.getElementById('step_description').value,
      responsible_role: document.getElementById('responsible_role').value,
      input_data: document.getElementById('input_data').value,
      output_data: document.getElementById('output_data').value,
      gov_platform: document.getElementById('gov_platform').value,
      compliance_notes: document.getElementById('compliance_notes').value,
      notes: document.getElementById('notes').value,
      employeeEmail: document.getElementById('employeeEmail').value,
      fileBase64: fileBase64,
      fileName: fileName
    };
    
    try {
      const response = await fetch('https://script.google.com/macros/s/AKfycbxhKrFDu7P4JmJFCUZz3rdkNGFISsPzOlyXzOhG32kk_5G4TbOAdH7_dtDqyS8GPKNG/exec', {
        method: 'POST',
        mode: 'no-cors', // if CORS issues; or use cors with proper headers
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      // With no-cors you cannot read response, so assume success
      showToast("✅ تم الإرسال بنجاح. شكراً لك!", false);
      document.getElementById('sopForm').reset();
      selectedFile = null;
      fileNameDisplay.innerText = '';
    } catch (err) {
      showToast("❌ حدث خطأ: " + err.message, true);
    } finally {
      btn.disabled = false;
      btn.innerText = '✅ إرسال للمراجعة';
    }
  });
  
  function showToast(msg, isError) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = msg;
    toast.style.backgroundColor = isError ? '#b91c1c' : '#1e6f5c';
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 4000);
  }
</script>
</body>
</html>
