<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توثيق الإجراءات - خطوات متعددة</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', 'Cairo', sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 28px; padding: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    h1 { color: #1e2a3a; margin-bottom: 8px; }
    .sub { color: #4a627a; margin-bottom: 28px; border-right: 4px solid #2c7da0; padding-right: 16px; }
    label { display: block; font-weight: 600; margin-top: 20px; margin-bottom: 6px; color: #0f2b3d; }
    input, textarea, select { width: 100%; padding: 10px 14px; border: 1px solid #cfdfed; border-radius: 16px; font-size: 0.95rem; }
    textarea { min-height: 70px; resize: vertical; }
    .step-card { background: #f9fbfd; border-radius: 20px; padding: 18px; margin-top: 24px; border: 1px solid #e2edf2; position: relative; }
    .step-title { font-weight: bold; margin-bottom: 12px; color: #1e6f5c; display: flex; justify-content: space-between; align-items: center; }
    .remove-step { background: #e74c3c; color: white; border: none; border-radius: 40px; padding: 4px 12px; cursor: pointer; font-size: 0.8rem; }
    .btn-group { display: flex; gap: 16px; margin-top: 32px; flex-wrap: wrap; }
    button { background: #1e6f5c; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: bold; cursor: pointer; flex: 1; }
    .btn-secondary { background: #2c7da0; }
    .btn-danger { background: #e67e22; }
    .add-step-btn { background: #3498db; margin-top: 16px; width: auto; padding: 8px 20px; }
    .toast { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e2a3a; color: white; padding: 12px; border-radius: 60px; text-align: center; display: none; z-index: 1000; }
    hr { margin: 20px 0; }
    @media (max-width: 640px) { .container { padding: 18px; } .btn-group { flex-direction: column; } }
  </style>
</head>
<body>
<div class="container">
  <h1>📋 توثيق الإجراءات اليدوية الحالية</h1>
  <div class="sub">يمكنك إضافة عدة خطوات لنفس المهمة. كل خطوة ستصبح سطراً مستقلاً في قاعدة البيانات.</div>

  <form id="taskForm">
    <label>👤 اسم الموظف (اختياري)</label>
    <input type="text" id="employeeName" placeholder="اختياري">

    <label>🏷️ اسم المهمة (مثال: إصدار تأشيرة عامل)</label>
    <input type="text" id="taskName" required>

    <div id="stepsContainer"></div>

    <button type="button" class="add-step-btn" id="addStepBtn">➕ إضافة خطوة جديدة</button>

    <div class="btn-group">
      <button type="submit" id="submitBtn">✅ إرسال جميع الخطوات</button>
      <button type="button" id="newTaskBtn" class="btn-secondary">🔄 إضافة مهمة أخرى (مسح النموذج)</button>
    </div>
  </form>
</div>
<div id="toastMsg" class="toast"></div>

<script>
  let stepCounter = 0;

  function createStepBlock(stepNumber = null) {
    const idx = stepNumber !== null ? stepNumber : stepCounter++;
    const div = document.createElement('div');
    div.className = 'step-card';
    div.setAttribute('data-step-idx', idx);
    div.innerHTML = `
      <div class="step-title">
        <span>📌 الخطوة ${idx+1}</span>
        <button type="button" class="remove-step" onclick="this.closest('.step-card').remove()">✖ إزالة</button>
      </div>
      <label>📝 وصف الخطوة</label>
      <textarea class="step-desc" placeholder="مثال: سجل الدخول إلى منصة قوى..." required></textarea>
      
      <label>✅ النتيجة / المخرج</label>
      <textarea class="step-outcome" placeholder="مثال: رقم طلب التأشيرة"></textarea>
      
      <label>⏱️ المدة التقريبية</label>
      <input class="step-duration" placeholder="مثال: 5 دقائق">
      
      <label>📜 الإجراء الواجب اتباعه (اختياري)</label>
      <textarea class="step-procedure" placeholder="مثال: يجب التحقق من نسبة السعودة"></textarea>
      
      <label>🏛️ الجهة الحكومية (مهم جداً)</label>
      <input class="step-gov" placeholder="مثال: قوى / مدد / مقيم / اتصال هاتفي بالوزارة" required>
    `;
    return div;
  }

  const stepsContainer = document.getElementById('stepsContainer');
  function addStep() {
    stepsContainer.appendChild(createStepBlock());
  }

  // Initialize with 1 empty step
  addStep();

  document.getElementById('addStepBtn').addEventListener('click', addStep);

  // Submit: collect all steps and send as array
  document.getElementById('taskForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const employeeName = document.getElementById('employeeName').value.trim();
    const taskName = document.getElementById('taskName').value.trim();
    if (!taskName) {
      showToast('❌ الرجاء إدخال اسم المهمة', true);
      return;
    }

    const stepCards = document.querySelectorAll('.step-card');
    const stepsData = [];
    let valid = true;
    stepCards.forEach((card, idx) => {
      const desc = card.querySelector('.step-desc').value.trim();
      const gov = card.querySelector('.step-gov').value.trim();
      if (!desc) {
        showToast(`الخطوة ${idx+1}: وصف الخطوة مطلوب`, true);
        valid = false;
      }
      if (!gov) {
        showToast(`الخطوة ${idx+1}: الجهة الحكومية مطلوبة`, true);
        valid = false;
      }
      stepsData.push({
        step: desc,
        outcome: card.querySelector('.step-outcome').value.trim(),
        duration: card.querySelector('.step-duration').value.trim(),
        procedure: card.querySelector('.step-procedure').value.trim(),
        gov_entity: gov
      });
    });
    if (!valid) return;

    const payload = {
      employee_name: employeeName,
      task_name: taskName,
      steps: stepsData
    };

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = 'جاري الإرسال...';
    try {
      const response = await fetch('YOUR_EXEC_URL', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (result.success) {
        showToast(`✅ تم حفظ ${stepsData.length} خطوة بنجاح`, false);
        // Optional: clear steps but keep task? Better: do nothing, user can manually clear.
        // For better UX, we don't auto-clear because user might want to add another task via the dedicated button.
      } else {
        showToast('❌ خطأ: ' + result.error, true);
      }
    } catch (err) {
      showToast('❌ فشل الإرسال: ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.innerText = '✅ إرسال جميع الخطوات';
    }
  });

  // Add another task: reset entire form
  document.getElementById('newTaskBtn').addEventListener('click', () => {
    document.getElementById('employeeName').value = '';
    document.getElementById('taskName').value = '';
    stepsContainer.innerHTML = '';
    stepCounter = 0;
    addStep(); // add one empty step
    showToast('🔄 تم مسح النموذج. يمكنك إدخال مهمة جديدة.', false);
  });

  function showToast(msg, isError) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = msg;
    toast.style.backgroundColor = isError ? '#b91c1c' : '#1e6f5c';
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 4000);
  }
</script>
</body>
</html>
